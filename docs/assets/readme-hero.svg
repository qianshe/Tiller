  <rect x="28" y="24" width="904" height="252" rx="28" fill="#0B1120" fill-opacity="0.72" stroke="#1E293B"/>
  <path d="M74 68H226" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M734 68H886" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
