name: Publish npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: prerelease-alpha
        type: choice
        options:
          - prerelease-alpha
          - prerelease-beta
          - prerelease-rc
          - patch
          - minor
          - major
      dist_tag:
        description: "npm dist-tag"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - latest
      base_branch:
        description: "Branch to release from"
        required: true
        default: main
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Bump, release and publish @qianshe/tiller
    runs-on: ubuntu-latest

    steps:
      - name: Validate bump and dist-tag
        shell: bash
        run: |
          BUMP="${{ inputs.bump }}"
          DIST_TAG="${{ inputs.dist_tag }}"
          case "$BUMP" in
            prerelease-alpha|prerelease-beta|prerelease-rc)
              EXPECTED_DIST_TAG="preview"
              ;;
            patch|minor|major)
              EXPECTED_DIST_TAG="latest"
              ;;
            *)
              echo "Unsupported bump type: $BUMP"
              exit 1
              ;;
          esac
          if [ "$DIST_TAG" != "$EXPECTED_DIST_TAG" ]; then
            echo "Bump $BUMP must be published with npm dist-tag $EXPECTED_DIST_TAG, got $DIST_TAG."
            exit 1
          fi

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump package version
        id: version
        shell: bash
        run: |
          case "${{ inputs.bump }}" in
            prerelease-alpha)
              npm --prefix apps/helm version prerelease --preid alpha --no-git-tag-version
              ;;
            prerelease-beta)
              npm --prefix apps/helm version prerelease --preid beta --no-git-tag-version
              ;;
            prerelease-rc)
              npm --prefix apps/helm version prerelease --preid rc --no-git-tag-version
              ;;
            patch|minor|major)
              npm --prefix apps/helm version "${{ inputs.bump }}" --no-git-tag-version
              ;;
          esac
          VERSION="$(node -p "require('./apps/helm/package.json').version")"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Deck import boundary lint
        run: pnpm --filter @tiller/deck lint

      - name: Package smoke test
        run: pnpm --filter @tiller/helm pack:npm

      - name: Commit version bump and create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/helm/package.json
          git commit -m "chore: release ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${{ inputs.base_branch }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish npm package
        working-directory: apps/helm/dist-package
        run: npm publish --tag "${{ inputs.dist_tag }}" --access public

      - name: Create GitHub prerelease draft
        if: steps.version.outputs.prerelease == 'true'
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "apps/helm/qianshe-tiller-${{ steps.version.outputs.version }}.tgz" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --draft \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release draft
        if: steps.version.outputs.prerelease == 'false'
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "apps/helm/qianshe-tiller-${{ steps.version.outputs.version }}.tgz" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --draft
        env:
          GH_TOKEN: ${{ github.token }}
