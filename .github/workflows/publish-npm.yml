name: Publish npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: prerelease-alpha
        type: choice
        options:
          - prerelease-alpha
          - prerelease-beta
          - prerelease-rc
          - patch
          - minor
          - major
      base_branch:
        description: "Branch to release from"
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  release_plan:
    name: Resolve release plan
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.plan.outputs.bump }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
      npm_version_args: ${{ steps.plan.outputs.npm_version_args }}

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve npm dist-tag and version args
        id: plan
        run: node apps/helm/scripts/release-plan.mjs "${{ inputs.bump }}" >> "$GITHUB_OUTPUT"

      - name: Show release plan
        run: |
          echo "bump=${{ steps.plan.outputs.bump }}"
          echo "dist_tag=${{ steps.plan.outputs.dist_tag }}"
          echo "npm_version_args=${{ steps.plan.outputs.npm_version_args }}"

  verify_package:
    name: Verify and package
    runs-on: ubuntu-latest
    needs: release_plan
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump package version
        id: version
        shell: bash
        run: |
          read -r -a VERSION_ARGS <<< "${{ needs.release_plan.outputs.npm_version_args }}"
          npm --prefix apps/helm version "${VERSION_ARGS[@]}" --no-git-tag-version
          VERSION="$(node -p "require('./apps/helm/package.json').version")"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Deck import boundary lint
        run: pnpm --filter @tiller/deck lint

      - name: Package smoke test
        run: pnpm --filter @tiller/helm pack:npm

      - name: Create npm tarball
        run: pnpm --filter @tiller/helm pack:tarball

      - name: Upload dist package
        uses: actions/upload-artifact@v4
        with:
          name: dist-package-${{ steps.version.outputs.version }}
          path: apps/helm/dist-package
          if-no-files-found: error

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball-${{ steps.version.outputs.version }}
          path: apps/helm/qianshe-tiller-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error

  publish_npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs:
      - release_plan
      - verify_package
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Apply verified version bump
        shell: bash
        run: |
          read -r -a VERSION_ARGS <<< "${{ needs.release_plan.outputs.npm_version_args }}"
          npm --prefix apps/helm version "${VERSION_ARGS[@]}" --no-git-tag-version
          VERSION="$(node -p "require('./apps/helm/package.json').version")"
          if [ "$VERSION" != "${{ needs.verify_package.outputs.version }}" ]; then
            echo "Expected version ${{ needs.verify_package.outputs.version }}, got $VERSION."
            exit 1
          fi

      - name: Commit version bump and create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/helm/package.json
          git commit -m "chore: release ${{ needs.verify_package.outputs.version }}"
          git tag "${{ needs.verify_package.outputs.tag }}"
          git push origin "HEAD:${{ inputs.base_branch }}"
          git push origin "${{ needs.verify_package.outputs.tag }}"

      - name: Download verified dist package
        uses: actions/download-artifact@v4
        with:
          name: dist-package-${{ needs.verify_package.outputs.version }}
          path: apps/helm/dist-package

      - name: Publish npm package
        working-directory: apps/helm/dist-package
        run: npm publish --tag "${{ needs.release_plan.outputs.dist_tag }}" --access public

  create_github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release_plan
      - verify_package
      - publish_npm
    permissions:
      contents: write

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download verified dist package
        uses: actions/download-artifact@v4
        with:
          name: dist-package-${{ needs.verify_package.outputs.version }}
          path: apps/helm/dist-package

      - name: Download npm tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-tarball-${{ needs.verify_package.outputs.version }}
          path: release-assets

      - name: Prepare GitHub Release notes and zip
        id: release_assets
        shell: bash
        run: |
          VERSION="${{ needs.verify_package.outputs.version }}"
          TAG="${{ needs.verify_package.outputs.tag }}"
          DIST_TAG="${{ needs.release_plan.outputs.dist_tag }}"
          TAR_PATH="release-assets/qianshe-tiller-${VERSION}.tgz"
          ZIP_PATH="release-assets/qianshe-tiller-${VERSION}.zip"
          NOTES_PATH="release-assets/release-notes-${VERSION}.md"
          mkdir -p release-assets

          git fetch origin "${{ inputs.base_branch }}" --tags
          git checkout "$TAG"

          (cd apps/helm/dist-package && zip -qr "../../../${ZIP_PATH}" .)

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${TAG}"
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
          else
            RANGE="$TAG"
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi

          {
            echo "## Tiller ${VERSION}"
            echo
            echo "- npm package: \`@qianshe/tiller@${VERSION}\`"
            echo "- npm dist-tag: \`${DIST_TAG}\`"
            echo "- Git tag: \`${TAG}\`"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "- Previous tag: \`${PREVIOUS_TAG}\`"
            fi
            echo "- Compare: ${COMPARE_URL}"
            echo
            echo "## Commits in this release"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" || true
            echo
            echo
            echo "## Issues and pull requests"
            echo
          } > "$NOTES_PATH"

          if [ -n "$PREVIOUS_TAG" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${{ inputs.base_branch }}" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              --jq .body >> "$NOTES_PATH" || echo "GitHub generated notes were unavailable." >> "$NOTES_PATH"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${{ inputs.base_branch }}" \
              --jq .body >> "$NOTES_PATH" || echo "GitHub generated notes were unavailable." >> "$NOTES_PATH"
          fi

          echo "tar_path=$TAR_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "notes_path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        shell: bash
        run: |
          RELEASE_FLAGS=()
          if [ "${{ needs.verify_package.outputs.prerelease }}" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "${{ needs.verify_package.outputs.tag }}" \
            "${{ steps.release_assets.outputs.tar_path }}" \
            "${{ steps.release_assets.outputs.zip_path }}" \
            --title "${{ needs.verify_package.outputs.tag }}" \
            --notes-file "${{ steps.release_assets.outputs.notes_path }}" \
            "${RELEASE_FLAGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
