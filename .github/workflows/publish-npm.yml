name: Publish npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: prerelease-alpha
        type: choice
        options:
          - prerelease-alpha
          - prerelease-beta
          - prerelease-rc
          - patch
          - minor
          - major
      dist_tag:
        description: "npm dist-tag"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - latest
      base_branch:
        description: "Branch to release from"
        required: true
        default: main
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Bump, release and publish @qianshe/tiller
    runs-on: ubuntu-latest

    steps:
      - name: Validate bump and dist-tag
        shell: bash
        run: |
          BUMP="${{ inputs.bump }}"
          DIST_TAG="${{ inputs.dist_tag }}"
          case "$BUMP" in
            prerelease-alpha|prerelease-beta|prerelease-rc)
              EXPECTED_DIST_TAG="preview"
              ;;
            patch|minor|major)
              EXPECTED_DIST_TAG="latest"
              ;;
            *)
              echo "Unsupported bump type: $BUMP"
              exit 1
              ;;
          esac
          if [ "$DIST_TAG" != "$EXPECTED_DIST_TAG" ]; then
            echo "Bump $BUMP must be published with npm dist-tag $EXPECTED_DIST_TAG, got $DIST_TAG."
            exit 1
          fi

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump package version
        id: version
        shell: bash
        run: |
          case "${{ inputs.bump }}" in
            prerelease-alpha)
              npm --prefix apps/helm version prerelease --preid alpha --no-git-tag-version
              ;;
            prerelease-beta)
              npm --prefix apps/helm version prerelease --preid beta --no-git-tag-version
              ;;
            prerelease-rc)
              npm --prefix apps/helm version prerelease --preid rc --no-git-tag-version
              ;;
            patch|minor|major)
              npm --prefix apps/helm version "${{ inputs.bump }}" --no-git-tag-version
              ;;
          esac
          VERSION="$(node -p "require('./apps/helm/package.json').version")"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Deck import boundary lint
        run: pnpm --filter @tiller/deck lint

      - name: Package smoke test
        run: pnpm --filter @tiller/helm pack:npm

      - name: Commit version bump and create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/helm/package.json
          git commit -m "chore: release ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${{ inputs.base_branch }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Prepare GitHub Release notes and zip
        id: release_assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          TAR_PATH="apps/helm/qianshe-tiller-${VERSION}.tgz"
          ZIP_PATH="release-assets/qianshe-tiller-${VERSION}.zip"
          NOTES_PATH="release-assets/release-notes-${VERSION}.md"
          mkdir -p release-assets

          (cd apps/helm/dist-package && zip -qr "../../../${ZIP_PATH}" .)

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${TAG}"
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
          else
            RANGE="$TAG"
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi

          {
            echo "## Tiller ${VERSION}"
            echo
            echo "- npm package: \`@qianshe/tiller@${VERSION}\`"
            echo "- npm dist-tag: \`${{ inputs.dist_tag }}\`"
            echo "- Git tag: \`${TAG}\`"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "- Previous tag: \`${PREVIOUS_TAG}\`"
            fi
            echo "- Compare: ${COMPARE_URL}"
            echo
            echo "## Commits in this release"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" || true
            echo
            echo
            echo "## Issues and pull requests"
            echo
          } > "$NOTES_PATH"

          if [ -n "$PREVIOUS_TAG" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${{ inputs.base_branch }}" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              --jq .body >> "$NOTES_PATH" || echo "GitHub generated notes were unavailable." >> "$NOTES_PATH"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${{ inputs.base_branch }}" \
              --jq .body >> "$NOTES_PATH" || echo "GitHub generated notes were unavailable." >> "$NOTES_PATH"
          fi

          echo "tar_path=$TAR_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "notes_path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish npm package
        working-directory: apps/helm/dist-package
        run: npm publish --tag "${{ inputs.dist_tag }}" --access public

      - name: Create GitHub prerelease draft
        if: steps.version.outputs.prerelease == 'true'
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.release_assets.outputs.tar_path }}" \
            "${{ steps.release_assets.outputs.zip_path }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "${{ steps.release_assets.outputs.notes_path }}" \
            --draft \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release draft
        if: steps.version.outputs.prerelease == 'false'
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.release_assets.outputs.tar_path }}" \
            "${{ steps.release_assets.outputs.zip_path }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "${{ steps.release_assets.outputs.notes_path }}" \
            --draft
        env:
          GH_TOKEN: ${{ github.token }}
