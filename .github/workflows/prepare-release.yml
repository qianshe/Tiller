name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: prerelease-alpha
        type: choice
        options:
          - prerelease-alpha
          - prerelease-beta
          - prerelease-rc
          - patch
          - minor
          - major
      base_branch:
        description: "Branch to release from"
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare version tag and GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump package version
        id: version
        shell: bash
        run: |
          case "${{ inputs.bump }}" in
            prerelease-alpha)
              npm version prerelease --preid alpha --no-git-tag-version --workspace apps/helm
              ;;
            prerelease-beta)
              npm version prerelease --preid beta --no-git-tag-version --workspace apps/helm
              ;;
            prerelease-rc)
              npm version prerelease --preid rc --no-git-tag-version --workspace apps/helm
              ;;
            patch|minor|major)
              npm version "${{ inputs.bump }}" --no-git-tag-version --workspace apps/helm
              ;;
            *)
              echo "Unsupported bump type: ${{ inputs.bump }}"
              exit 1
              ;;
          esac
          VERSION="$(node -p "require('./apps/helm/package.json').version")"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Deck import boundary lint
        run: pnpm --filter @tiller/deck lint

      - name: Package smoke test
        run: pnpm --filter @tiller/helm pack:npm

      - name: Commit version bump and create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/helm/package.json
          git commit -m "chore: release ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${{ inputs.base_branch }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub prerelease
        if: steps.version.outputs.prerelease == 'true'
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "apps/helm/qianshe-tiller-${{ steps.version.outputs.version }}.tgz" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --draft \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        if: steps.version.outputs.prerelease == 'false'
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "apps/helm/qianshe-tiller-${{ steps.version.outputs.version }}.tgz" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --draft
        env:
          GH_TOKEN: ${{ github.token }}
